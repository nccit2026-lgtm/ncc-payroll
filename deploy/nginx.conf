# /etc/nginx/sites-available/ncc-payroll  — salary.example.gov.bd আপনার ডোমেইন দিয়ে বদলান
# HTTPS: sudo certbot --nginx -d salary.example.gov.bd
server {
    listen 80;
    server_name salary.example.gov.bd;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
