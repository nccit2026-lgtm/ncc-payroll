{% extends "base.html" %}
{% block title %}পাসওয়ার্ড পরিবর্তন{% endblock %}
{% block content %}
<div class="topbar"><h1>পাসওয়ার্ড পরিবর্তন</h1></div>
<form class="card" method="post" style="max-width:460px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label>বর্তমান পাসওয়ার্ড</label><input type="password" name="old" required autocomplete="current-password"></div>
  <div class="field"><label>নতুন পাসওয়ার্ড</label><input type="password" name="new" required minlength="6" autocomplete="new-password"><div class="hint">কমপক্ষে ৬ অক্ষর</div></div>
  <div class="field"><label>নতুন পাসওয়ার্ড আবার</label><input type="password" name="confirm" required autocomplete="new-password"></div>
  <button class="primary" type="submit">সংরক্ষণ</button>
</form>
{% endblock %}
